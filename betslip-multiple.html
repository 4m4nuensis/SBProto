<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VBet — Betslip (Multiple)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010c23;
  --bg-32:rgba(1,12,35,.32);
  --bg-60:rgba(1,12,35,.6);
  --main:#d80d83;
  --main-16:rgba(216,13,131,.16);
  --odds:#ffad29;
  --green:#109121;
  --green-bright:#22c55e;
  --red:#ef4444;
  --w-100:#fff;
  --w-90:rgba(255,255,255,.9);
  --w-80:rgba(255,255,255,.8);
  --w-72:rgba(255,255,255,.72);
  --w-64:rgba(255,255,255,.64);
  --w-56:rgba(255,255,255,.56);
  --w-48:rgba(255,255,255,.48);
  --w-40:rgba(255,255,255,.4);
  --w-32:rgba(255,255,255,.32);
  --w-24:rgba(255,255,255,.24);
  --w-16:rgba(255,255,255,.16);
  --w-12:rgba(255,255,255,.12);
  --w-8:rgba(255,255,255,.08);
  --w-4:rgba(255,255,255,.04);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#010c23;font-family:'Rubik',system-ui,-apple-system,sans-serif;color:var(--w-100);font-size:14px;line-height:20px;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none;width:100%}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

.app{
  width:100%;max-width:440px;margin:0 auto;min-height:100vh;
  background:var(--bg);position:relative;
  overflow-x:hidden;padding-bottom:180px;
}

/* ========== STATUS BAR ========== */
.statusbar{
  position:relative;height:40px;width:100%;
  background:linear-gradient(90deg,var(--w-4) 0%,var(--w-4) 100%),linear-gradient(90deg,var(--bg) 0%,var(--bg) 100%);
}
.statusbar .time{
  position:absolute;left:48px;top:50%;transform:translate(-50%,-50%);
  font-family:'SF Pro','SF Pro Display','-apple-system',sans-serif;
  font-weight:700;font-size:14px;letter-spacing:-.3px;color:var(--w-90);text-align:center;width:54px;
}
.statusbar .battery{position:absolute;top:50%;right:19px;transform:translateY(-50%);width:20.926px;height:9.748px}
.statusbar .wifi{position:absolute;top:50%;right:44.23px;transform:translateY(-50%);width:13.188px;height:9.461px}
.statusbar .cellular{position:absolute;top:50%;right:61.72px;transform:translateY(-50%);width:14.622px;height:9.175px}

/* ========== BETSLIP CONTAINER ========== */
.betslip{
  width:100%;
  padding:0 8px 8px;
  border-top:1px solid var(--w-16);
  border-radius:8px;
  background:linear-gradient(90deg,var(--w-4) 0%,var(--w-4) 100%),var(--bg);
  backdrop-filter:blur(15px);
  display:flex;flex-direction:column;
}

/* ========== TOP TABS ========== */
.bs-top-tabs{
  display:flex;align-items:center;justify-content:center;width:100%;
}
.bs-top-tab{
  flex:1;height:40px;max-height:40px;min-height:40px;
  padding:6px 2px 8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;cursor:pointer;
}
.bs-top-tab .label{
  font-size:14px;line-height:20px;font-weight:400;white-space:nowrap;
}
.bs-top-tab.active .label{color:var(--w-100)}
.bs-top-tab:not(.active) .label{color:var(--w-32)}
.bs-top-tab .bs-count{
  width:20px;height:20px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;line-height:16px;text-align:center;
}
.bs-top-tab.active .bs-count{background:var(--w-12);color:var(--w-100)}
.bs-top-tab:not(.active) .bs-count{background:var(--bg-32);color:var(--w-48)}
.bs-top-tab .curve-bg{
  position:absolute;left:-20.42px;top:0;width:207.918px;height:40px;pointer-events:none;
}

/* ========== MAIN ========== */
.bs-main{
  display:flex;flex-direction:column;gap:8px;align-items:center;
  padding:8px 0;width:100%;
}

/* ========== TYPE TABS ========== */
.bs-type-tabs{
  display:flex;gap:8px;align-items:center;width:100%;
  padding:4px;border-radius:88px;
}
.bs-type-tab{
  flex:1;min-width:0;height:24px;max-height:24px;min-height:24px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 12px;border-radius:999px;cursor:pointer;
  background:var(--w-8);
}
.bs-type-tab.active{
  background:var(--main-16);border:1px solid var(--main);padding:7px 11px;
}
.bs-type-tab .lbl{
  font-size:12px;line-height:16px;color:var(--w-72);white-space:nowrap;padding:0 4px;
}
.bs-trash{
  width:32px;height:32px;min-width:32px;min-height:32px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bs-trash img{width:16px;height:16px}

/* ========== BET TICKETS (Multiple — compact, no per-ticket stake) ========== */
.bs-tickets{
  display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:100%;
}
.bs-empty{
  width:100%;padding:32px 16px;border-radius:8px;
  background:var(--w-4);border:1px dashed var(--w-12);
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
}
.bs-empty .ttl{font-size:14px;line-height:20px;color:var(--w-72);font-weight:500}
.bs-empty .sub{font-size:12px;line-height:16px;color:var(--w-48)}
/* Hide draft-mode controls when there are no drafts; show them when drafts exist */
.bs-main.is-empty .bs-total-odds,
.bs-main.is-empty .bs-counter-offer,
.bs-main.is-empty .bs-presets,
.bs-main.is-empty .bs-stake-field,
.bs-main.is-empty .bs-info-row,
.bs-main.is-empty .bs-boost,
.bs-main.is-empty .bs-odds-select,
.bs-main.is-empty .bs-actions{display:none}
.bs-ticket{
  width:100%;
  background:var(--w-8);
  border-radius:6px;
  padding:4px 8px 8px;
  display:flex;flex-direction:column;gap:4px;
}
.bs-ticket-title{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  border-bottom:1px dashed var(--w-12);
}
.bs-ticket-date{
  flex:1;height:32px;display:flex;align-items:center;gap:4px;
}
.bs-ticket-date .txt{
  font-size:12px;line-height:16px;color:var(--w-56);letter-spacing:.4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bs-ticket-date .dot{width:4px;height:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bs-ticket-date .dot img{width:4px;height:4px}
.bs-ticket-close{
  width:24px;height:24px;min-width:24px;min-height:24px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bs-ticket-close img{width:16px;height:16px}

.bs-ticket-selection{
  display:flex;align-items:flex-start;justify-content:space-between;width:100%;gap:8px;
}
.bs-ticket-selection .name{
  font-size:14px;line-height:20px;font-weight:500;color:var(--w-80);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bs-ticket-selection .odds{
  font-size:14px;line-height:20px;color:var(--odds);text-align:center;white-space:nowrap;
}
.bs-ticket-selection .odds-old{
  font-size:14px;line-height:20px;color:var(--red);text-align:center;white-space:nowrap;
  text-decoration:line-through;margin-right:8px;
}
.bs-ticket-selection .odds-group{display:flex;align-items:center}

.bs-ticket-market{
  display:flex;flex-direction:column;gap:2px;width:100%;
  font-size:12px;line-height:16px;
}
.bs-ticket-market .mkt{color:var(--w-72);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs-ticket-market .teams{color:var(--w-100);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ========== TOTAL ODDS ========== */
.bs-total-odds{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:8px;font-size:14px;line-height:20px;
}
.bs-total-odds .lbl{color:var(--w-72)}
.bs-total-odds .amt{color:var(--odds);font-weight:500}

/* ========== COUNTER OFFER ========== */
.bs-counter-offer{
  width:100%;height:32px;border-radius:88px;
  background:var(--w-4);
  padding:4px 8px 4px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.bs-counter-offer .logo{
  width:97px;height:12px;display:block;
}
.bs-switch{padding:2px;display:flex;align-items:flex-start}
.bs-switch .track{
  width:34px;height:20px;border-radius:999px;background:var(--w-32);position:relative;
}
.bs-switch .knob{
  position:absolute;top:2px;left:2px;
  width:20px;height:16px;border-radius:999px;background:var(--bg);
  transition:left .15s ease;
}
.bs-switch.on .track{background:var(--main)}
.bs-switch.on .knob{left:12px}

/* ========== PRESETS ========== */
.bs-presets{
  display:flex;gap:8px;align-items:flex-start;width:100%;
}
.bs-presets .preset{
  flex:1;min-width:56px;height:32px;
  display:flex;align-items:center;justify-content:center;
  padding:6px 16px;border-radius:999px;
  background:var(--w-8);border-top:1px solid var(--w-16);
  font-size:12px;line-height:16px;color:var(--w-90);white-space:nowrap;
}

/* ========== STAKE FIELD (Multiple — single field) ========== */
.bs-stake-field{
  width:100%;height:40px;border-radius:999px;background:var(--w-8);
  display:flex;align-items:center;gap:8px;padding:0 16px;
}
.bs-stake-field .value{
  flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--w-80);
  background:transparent;border:0;outline:none;
}
.bs-stake-field .max{font-size:14px;line-height:20px;color:var(--w-56);white-space:nowrap}

/* ========== INFO ROWS ========== */
.bs-info-row{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:0 8px;font-size:12px;line-height:16px;
}
.bs-info-row .lbl{color:var(--w-40)}
.bs-info-row .lbl b{color:var(--w-72);font-weight:700}
.bs-info-row .amt{color:var(--w-64)}

/* ========== BONUS BOOST ========== */
.bs-boost{
  position:relative;width:100%;
  background:var(--w-4);
  border:1px solid var(--odds);
  border-radius:8px;
  padding:8px;
  display:flex;flex-direction:column;gap:8px;
}
.bs-boost-tag{
  position:absolute;top:-1px;right:-1px;
  background:var(--odds);
  border-radius:0 8px 0 8px;
  padding:2px 8px;
  display:flex;align-items:center;gap:4px;
  font-size:10px;line-height:14px;font-weight:700;color:var(--bg);
  letter-spacing:.4px;
}
.bs-boost-tag .arrow{
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--bg);
}
.bs-boost-head{
  display:flex;align-items:flex-start;gap:6px;
  padding-right:90px; /* room for the tag */
}
.bs-boost-head .info{
  width:16px;height:16px;flex-shrink:0;border-radius:999px;
  background:var(--w-12);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--w-72);font-family:serif;
}
.bs-boost-head .txt{
  font-size:12px;line-height:16px;color:var(--w-72);
}
.bs-boost-head .txt b{color:var(--w-100);font-weight:700}
.bs-boost-msg{
  font-size:12px;line-height:16px;color:var(--w-100);
  padding-left:22px;
}
.bs-boost-msg b{font-weight:700}

.bs-boost-progress{
  display:flex;align-items:flex-end;gap:0;width:100%;
}
.bs-boost-cell{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;
  border-right:1px solid var(--w-12);
  padding:0 2px;
}
.bs-boost-cell:last-of-type{border-right:0}
.bs-boost-cell .pct{
  font-size:12px;line-height:16px;font-weight:500;color:var(--w-100);
  text-align:center;letter-spacing:.4px;
}
.bs-boost-cell.current .pct{color:var(--main)}
.bs-boost-cell .bar{
  width:100%;height:4px;border-radius:2px;background:var(--w-12);
}
.bs-boost-cell.filled .bar{background:var(--green-bright)}
.bs-boost-cell.current .bar{background:var(--green-bright)}
.bs-boost-cell .caret{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--green-bright);
}
.bs-boost-plus{
  width:24px;height:24px;flex-shrink:0;border-radius:6px;
  background:var(--w-12);
  display:flex;align-items:center;justify-content:center;
  color:var(--w-100);font-size:16px;line-height:1;font-weight:400;
  margin-left:4px;
}

/* ========== ODDS CHANGE SELECT ========== */
.bs-odds-select{
  width:100%;height:32px;border-radius:999px;background:var(--w-8);
  padding:0 16px;
  display:flex;align-items:center;gap:8px;
}
.bs-odds-select .lbl{
  flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--w-56);
}
.bs-odds-select .chev{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bs-odds-select .chev img{width:9.33px;height:5.33px}

/* ========== ACTIONS ========== */
.bs-actions{
  display:flex;gap:8px;align-items:flex-start;width:100%;
}
.bs-place-bet{
  flex:1;min-width:88px;height:40px;
  display:flex;align-items:center;justify-content:center;
  padding:0 24px;border-radius:999px;
  background:var(--green);
  font-size:14px;line-height:20px;font-weight:500;color:var(--w-100);white-space:nowrap;
}
.bs-share{
  width:40px;height:40px;min-width:40px;min-height:40px;border-radius:999px;
  background:var(--w-8);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bs-share img{width:20px;height:20px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Status Bar ===== -->
  <div class="statusbar">
    <p class="time">9:41</p>
    <img class="cellular" src="assets/9a9814626f1691496dee37fbaec4dc36714c9fc3.svg" alt="">
    <img class="wifi" src="assets/8a2078f592bc8059bdee9a1b67c5850384630832.svg" alt="">
    <img class="battery" src="assets/f555df63f6a65f0f822624125f6922109416d804.svg" alt="">
  </div>

  <!-- ===== Betslip ===== -->
  <div class="betslip">

    <!-- Top tabs (component) -->
    <div data-bs-tabs="betslip"></div>
    <script src="bs-tabs.js"></script>

    <!-- Main -->
    <div class="bs-main is-empty" id="bs-main">

      <!-- Type tabs -->
      <div class="bs-type-tabs">
        <a class="bs-type-tab" href="betslip.html"><span class="lbl">Single</span></a>
        <div class="bs-type-tab active"><span class="lbl">Multiple</span></div>
        <div class="bs-type-tab"><span class="lbl">System</span></div>
        <button class="bs-trash" id="bs-trash" aria-label="clear all"><img src="assets/bs-trash.svg" alt=""></button>

      <div class="bs-counter-offer">

        <div class="bs-switch"><div class="track"><div class="knob"></div></div></div>

      <!-- Presets -->
      <div class="bs-presets">
        <button class="preset">100</button>
        <button class="preset">500</button>
        <button class="preset">1 000</button>
      </div>

      <!-- Stake field -->
      <div class="bs-stake-field">
        <input class="value" type="text" value="4 000.00">
        <span class="max">MAX</span>
      </div>

      <!-- Info rows -->
      <div class="bs-info-row">
        <span class="lbl">Possible Win:</span>
        <span class="amt">$ 100 000.00</span>
      </div>
      <div class="bs-info-row">
        <span class="lbl">Accumulator <b>Bonus 3%</b>:</span>
        <span class="amt">$ 45.00</span>
      </div>
      <div class="bs-info-row">
        <span class="lbl">Final payout:</span>
        <span class="amt">$ 1 545.00</span>
      </div>

      <!-- Bonus Boost -->
      <div class="bs-boost">
        <div class="bs-boost-tag">
          <span>BONUS BOOST</span>
          <span class="arrow"></span>
        </div>
        <div class="bs-boost-head">
          <span class="info">i</span>
          <p class="txt">Min. Odds = <b>1.3</b> &nbsp;|&nbsp; Min. Stake = <b>$0.10</b></p>
        </div>
        <p class="bs-boost-msg">Add 2 more events to get <b>5% Bonus!</b></p>
        <div class="bs-boost-progress">
          <div class="bs-boost-cell filled"><span class="pct">1.5%</span><div class="bar"></div></div>
          <div class="bs-boost-cell current"><span class="caret"></span><span class="pct">3%</span><div class="bar"></div></div>
          <div class="bs-boost-cell"><span class="pct">5%</span><div class="bar"></div></div>
          <div class="bs-boost-cell"><span class="pct">7.5%</span><div class="bar"></div></div>
          <div class="bs-boost-cell"><span class="pct">9%</span><div class="bar"></div></div>
          <div class="bs-boost-cell"><span class="pct">11%</span><div class="bar"></div></div>
          <div class="bs-boost-cell"><span class="pct">13</span><div class="bar"></div></div>
          <div class="bs-boost-plus">+</div>

      </div>

      <!-- Odds change select -->
      <div class="bs-odds-select">
        <span class="lbl">Accept only Higher Odds</span>
        <span class="chev"><img src="assets/bs-chevron-down.svg" alt=""></span>
      </div>

      <!-- Actions -->
      <div class="bs-actions">
        <button class="bs-place-bet">Place a Bet</button>
        <button class="bs-share" aria-label="share"><img src="assets/bs-share.svg" alt=""></button>
      </div>

    </div><!-- /bs-main -->
  </div><!-- /betslip -->

  <div id="app-nav" data-page="betslip"></div>
</div><!-- /.app -->
<script src="betslip-store.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  const main   = document.getElementById('bs-main');
  const list   = document.getElementById('bs-tickets');
  const trash  = document.getElementById('bs-trash');
  const totEl  = document.querySelector('.bs-total-odds .amt');
  const stakeI = document.querySelector('.bs-stake-field .value');
  const infoRows = document.querySelectorAll('.bs-info-row .amt');
  const pwAmt  = infoRows[0]; // Possible Win
  const placeBtn = document.querySelector('.bs-place-bet');
  const presets  = document.querySelectorAll('.bs-presets .preset');
  if (!main || !list) return;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtMoney(n) {
    const v = Number(n) || 0;
    const parts = v.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return '$ ' + parts.join('.');
  }
  function fmtStakeInput(n) {
    const v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function parseStake(v) {
    const n = parseFloat(String(v || '').replace(/[^\d.]/g, ''));
    return isFinite(n) ? n : 0;
  }

  function ticketHTML(b) {
    const dateBlock = (b.date || b.time)
      ? `<span class="txt">${esc(b.date)}</span>
         <span class="dot"><img src="assets/bs-dots-h.svg" alt=""></span>
         <span class="txt">${esc(b.time)}</span>`
      : `<span class="txt">Queued</span>`;
    return `
      <div class="bs-ticket" data-id="${esc(b.id)}">
        <div class="bs-ticket-title">
          <div class="bs-ticket-date">${dateBlock}</div>
          <button class="bs-ticket-close" aria-label="remove" data-remove="${esc(b.id)}">
            <img src="assets/bs-x-close.svg" alt="">
          </button>
        </div>
        <div class="bs-ticket-selection">
          <p class="name">${esc(b.selection)}</p>
          <p class="odds">${(Number(b.odds) || 0).toFixed(2)}</p>
        </div>
        <div class="bs-ticket-market">
          <p class="mkt">${esc(b.market)}</p>
          <p class="teams">${esc(b.teams)}</p>
        </div>
      </div>`;
  }

  function emptyHTML() {
    return `
      <div class="bs-empty">
        <p class="ttl">No multiple bets yet</p>
        <p class="sub">Tap two or more odds across the app to start building one.</p>
      </div>`;
  }

  function recompute() {
    const drafts = window.BetslipStore ? window.BetslipStore.getDrafts() : [];
    const totalOdds = drafts.reduce((acc, d) => acc * (Number(d.odds) || 1), 1);
    if (totEl) totEl.textContent = totalOdds.toFixed(2);
    const stake = parseStake(stakeI && stakeI.value);
    if (pwAmt) pwAmt.textContent = fmtMoney(stake * totalOdds);
  }

  function render() {
    const drafts = window.BetslipStore ? window.BetslipStore.getDrafts() : [];
    if (drafts.length === 0) {
      list.innerHTML = emptyHTML();
      main.classList.add('is-empty');
    } else {
      list.innerHTML = drafts.map(ticketHTML).join('');
      main.classList.remove('is-empty');
    }
    recompute();
  }

  // Remove a single draft
  list.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-remove]');
    if (!btn || !window.BetslipStore) return;
    window.BetslipStore.removeDraft(btn.getAttribute('data-remove'));
  });

  // Trash → clear all drafts
  if (trash) {
    trash.addEventListener('click', function () {
      if (window.BetslipStore) window.BetslipStore.clearDrafts();
    });
  }

  // Stake input → recompute
  if (stakeI) stakeI.addEventListener('input', recompute);

  // Presets
  presets.forEach(p => p.addEventListener('click', function () {
    if (!stakeI) return;
    stakeI.value = fmtStakeInput(parseStake(p.textContent));
    recompute();
  }));

  // Place a Bet → confirm drafts → Open Bets
  // - 1 draft  → single bet entry (re-uses the single placed-card style)
  // - 2+ drafts → ONE multi-bet entry (Multiple Bet (N) card per Figma 3582:869)
  if (placeBtn) {
    placeBtn.addEventListener('click', function () {
      if (!window.BetslipStore) return;
      const drafts = window.BetslipStore.getDrafts();
      if (!drafts.length) return;
      const stake = parseStake(stakeI && stakeI.value) || 0;
      if (drafts.length === 1) {
        const d = drafts[0];
        window.BetslipStore.addBet({
          selection: d.selection, market: d.market, teams: d.teams,
          odds: d.odds, stake, date: d.date, time: d.time,
        });
      } else {
        window.BetslipStore.addMultiBet({ legs: drafts, stake });
      }
      window.BetslipStore.clearDrafts();
      window.location.href = 'betslip-open-bets.html';
    });
  }

  if (window.BetslipStore) window.BetslipStore.subscribeDrafts(render);
  render();
})();
</script>
</body>
</html>
